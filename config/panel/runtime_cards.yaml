# Runtime-configured pages and cards (espcontrol-style). Shared by
# panel-s3.yaml and simulator.yaml. Everything is edited from the device web
# page and stored in the text entities below; the firmware talks to Home
# Assistant itself (see panel_cards.h).
esphome:
  build_flags:
    - -DLV_USE_CHART=1  # chart cards (created from C++, not from YAML)
  includes:
    - config/panel/panel_icons.h
    - config/panel/panel_cards.h

api:
  # Needed to subscribe to arbitrary HA entities and to call HA actions from C++.
  # In Home Assistant also enable "Allow the device to perform Home Assistant
  # actions" in the ESPHome device options.
  homeassistant_states: true
  homeassistant_services: true

text:
  - platform: template
    name: "Panel Pages"
    id: panel_pages
    mode: text
    min_length: 0
    max_length: 255
    optimistic: true
    restore_value: true
    initial_value: "Головна|home|1"
    entity_category: config
    disabled_by_default: true
    icon: "mdi:book-open-page-variant"
    on_value:
      then:
        - lambda: 'panel_cards::set_pages(x);'

  - platform: template
    name: "Panel Header Sensor"
    id: panel_header_sensor
    mode: text
    min_length: 0
    max_length: 255
    optimistic: true
    restore_value: true
    initial_value: ""
    entity_category: config
    disabled_by_default: true
    icon: "mdi:thermometer"
    on_value:
      then:
        - lambda: 'panel_cards::set_header_entity(x);'

  - platform: template
    name: "Panel Alarm Sensor"
    id: panel_alarm_sensor
    mode: text
    min_length: 0
    max_length: 255
    optimistic: true
    restore_value: true
    initial_value: ""
    entity_category: config
    disabled_by_default: true
    icon: "mdi:alarm-light"
    on_value:
      then:
        - lambda: 'panel_cards::set_alarm_entity(x);'

packages:
  card_1: !include { file: card_config.yaml, vars: { n: "1" } }
  card_2: !include { file: card_config.yaml, vars: { n: "2" } }
  card_3: !include { file: card_config.yaml, vars: { n: "3" } }
