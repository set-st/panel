# config/panel/top_layer.yaml
widgets:
  # Header (Status Bar)
  - obj:
      id: top_bar_header
      align: TOP_MID
      width: 100%
      height: 50
      bg_color: 0x07293E
      bg_opa: 100%
      radius: 0
      scrollbar_mode: "OFF"
      border_width: 0
      layout:
        type: flex
        flex_align_cross: center
        flex_align_main: space_between
        flex_flow: row
      pad_left: 15
      pad_right: 100
      widgets:
        # Левая часть: Время и Дата
        - obj:
            bg_opa: TRANSP
            border_width: 0
            width: 300
            layout: { type: flex, flex_flow: row, flex_align_cross: center }
            pad_all: 0
            widgets:
              - label:
                  id: top_time_label
                  text: "00:00"
                  text_font: roboto_22
                  text_color: 0xFFFFFF
                  pad_right: 15
                  margin_top: -10
                  align: CENTER
                  height: 50
              - label:
                  id: top_date_label
                  text: "01.01.2024"
                  text_font: roboto_14
                  text_color: 0xAAAAAA
                  width: 150
                  align: CENTER
                  height: 50

        # Правая часть: Статусы (Battery, HA, WiFi, Temp)
        # Positioned on its own (not by the header's flex layout, which pushed
        # it below the 50 px bar): right-aligned and vertically centred.
        - obj:
            id: top_status
            floating: true
            align: RIGHT_MID
            bg_opa: TRANSP
            border_width: 0
            width: 280
            height: 50
            layout: { type: flex, flex_flow: row, flex_align_cross: center, flex_align_track: center, flex_align_main: end }
            pad_all: 0
            widgets:
              # Internal battery: outline + level bar (system.yaml sets width/colour)
              - obj:
                  width: 30
                  height: 16
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  widgets:
                    - obj:
                        id: bat_body
                        align: LEFT_MID
                        width: 27
                        height: 16
                        radius: 4
                        border_width: 2
                        border_color: 0x8A9499
                        bg_opa: TRANSP
                        pad_all: 2
                        scrollbar_mode: "OFF"
                        widgets:
                          - obj:
                              id: bat_fill
                              align: LEFT_MID
                              width: 100%
                              height: 100%
                              radius: 2
                              border_width: 0
                              bg_color: 0x34C759
                              bg_opa: COVER
                    - obj:
                        align: RIGHT_MID
                        width: 3
                        height: 6
                        radius: 1
                        border_width: 0
                        bg_color: 0x8A9499
                        bg_opa: COVER

              - label:
                  id: lbl_bat_text
                  text: ""
                  text_font: roboto_14
                  text_color: 0xAAAAAA
                  pad_left: 6
                  pad_right: 20

              # HA Status Icon
              - label:
                  id: lbl_hastatus
                  text: "\U0000e935"
                  text_font: icons_20
                  text_color: 0x00FF00
                  pad_right: 20
              
              # WiFi Strength Icon
              - label:
                  id: lbl_wifi_signal
                  text: "\U0000e934"
                  text_font: icons_20
                  text_color: 0xFFFFFF
                  pad_right: 20
              
              # Header sensor (entity chosen in the web editor)
              - label:
                  id: lbl_top_temp
                  text: ""
                  text_font: roboto_14
                  text_color: 0xAAAAAA
                  on_boot:
                    then:
                      - lambda: 'panel_cards::bind_header(id(lbl_top_temp));'

  # Footer: page buttons are generated from the "Panel Pages" setting by
  # panel_cards.h; the sleep button on the right is fixed.
  - obj:
      id: nav_bar
      align: BOTTOM_MID
      styles: footer_style
      layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER }
      widgets:
        - obj:
            id: nav_pages
            height: 100%
            flex_grow: 1
            bg_opa: TRANSP
            border_width: 0
            radius: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            on_boot:
              then:
                - lambda: 'panel_cards::bind_nav(id(nav_pages), id(mdi_36)->get_lv_font(), id(roboto_22)->get_lv_font());'
        - button:
            id: nav_sleep_btn
            width: 80
            styles: btn_nav_style
            widgets:
              - label: { text: "\U000F0425", align: CENTER, text_font: mdi_20 }
            on_click:
              then:
                - lambda: |-
                    // Instant "night mode": dim now, wake on the next touch.
                    id(idle_counter) = 0;
                    id(display_backlight).make_call().set_brightness(0.03).perform();

  # Boot Screen (Initially Visible)
  - obj:
        id: boot_screen
        x: 0
        y: 0
        align: TOP_MID
        width: 100%
        height: 100%
        bg_color: 0x0B1114
        bg_opa: COVER
        radius: 0
        pad_all: 0
        border_width: 0
        widgets:
          - image:
              align: CENTER
              src: boot_logo
              y: -40
          - spinner:
              align: CENTER
              y: 95
              height: 50
              width: 50
              spin_time: 1s
              arc_length: 60deg
              arc_width: 8
              indicator:
                arc_color: 0x18bcf2
                arc_width: 8
        on_press:
          - lvgl.widget.hide: boot_screen