esphome:
  name: esp32-s3-touch-lcd-7b
  friendly_name: "Controll Panel"
  platformio_options:
    board_build.flash_mode: dio
    board_build.partitions: partitions.csv
  on_boot:
    priority: 600 
    then:
      - light.turn_on:
          id: display_backlight
          brightness: !lambda "return id(current_brightness);"
      - globals.set:
          id: boot_completed
          value: 'true'
      - delay: 5s
      - lvgl.widget.hide: boot_screen

http_request:
  verify_ssl: false

esp32:
  board: esp32s3box
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      loop_task_stack_size: 8192
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y
      CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM: "16"
      CONFIG_ESP_CONSOLE_UART_DEFAULT: y
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: y
      CONFIG_ESP_INT_WDT_TIMEOUT_MS: "3000"
      CONFIG_LOG_DEFAULT_LEVEL_INFO: y

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source: github://pr#10071
    components: [waveshare_io_ch32v003]
    refresh: 1h
  # Local copy of the GT911 driver with a datasheet-conform reset sequence and
  # retries (the stock one fails for good on a single I2C error at boot).
  - source:
      type: local
      path: components
    components: [gt911]

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

api:
  reboot_timeout: 15min
  encryption:
    key: "CE8BO+MhPzJUmZPTrWKOA6uytbyTxZUkexxKxmwMGA4="

captive_portal:

web_server:
  port: 80
  version: 3
  js_include: config/panel/configurator.js
  css_include: config/panel/configurator.css

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      - lvgl.pause:
      - logger.log: "OTA started, LVGL paused"
    on_end:
      - lvgl.resume:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  # WSL2 sits behind a NAT, so mDNS (.local) never reaches the device.
  # Force ESPHome to talk to the static IP directly for OTA/upload.
  use_address: 192.168.1.178
  ap:
    ssid: "Controll Panel Fallback"
  manual_ip:
    static_ip: 192.168.1.178
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 1.1.1.1
    dns2: 8.8.8.8

time:
  - platform: sntp
    id: sntp_time
    timezone: "EET-2EEST,M3.5.0/3,M10.5.0/4"
    on_time:
      - hours: 2,3,4,5
        minutes: 5
        seconds: 0
        then:
          - switch.turn_on: switch_antiburn
      - hours: 2,3,4,5
        minutes: 10
        seconds: 0
        then:
          - switch.turn_off: switch_antiburn

# --- Sensors ---

# --- Sensors (hardware only; HA entities are configured from the web page) ---
sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi Signal"
    entity_category: diagnostic
    update_interval: 10s

  # --- Internal Battery ---
  - platform: waveshare_io_ch32v003
    name: "Battery level"
    id: wave_adc
    reference_voltage: 9.9
    update_interval: 60s

  - platform: template
    id: internal_bat_pct
    name: "Internal Battery Percentage"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    lambda: |-
      float volt = id(wave_adc).state;
      if (std::isnan(volt)) return {};
      // Calibrate: max_v = wave_adc reading at 100%, min_v = voltage at shutdown.
      float max_v = 4.05;
      float min_v = 3.1;
      float pct = (volt - min_v) / (max_v - min_v) * 100.0;
      if (pct > 100.0) pct = 100.0;
      if (pct < 0.0) pct = 0.0;
      return pct;
    update_interval: 60s

switch:
  - platform: template
    name: Antiburn
    id: switch_antiburn
    icon: mdi:television-shimmer
    optimistic: true
    entity_category: "config"
    turn_on_action:
      - logger.log: "Starting Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - lvgl.pause:
          show_snow: true
    turn_off_action:
      - logger.log: "Stopping Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:

interval:
  # An air alarm interrupts the anti-burn-in "snow" so the screen shows it.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(switch_antiburn).state && panel_cards::alarm_level() > 0;'
          then:
            - switch.turn_off: switch_antiburn

# --- Hardware ---
waveshare_io_ch32v003:
  - id: waveshare_io_hub

i2c:
  - id: bus_a
    sda: GPIO08
    scl: GPIO09
    scan: true

display:
  - platform: rpi_dpi_rgb
    id: my_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 30MHZ
    dimensions: { width: 1024, height: 600 }
    de_pin: 5
    hsync_pin: { number: 46, ignore_strapping_warning: true }
    vsync_pin: { number: 3, ignore_strapping_warning: true }
    pclk_pin: 7
    pclk_inverted: true
    reset_pin: { waveshare_io_ch32v003: waveshare_io_hub, number: 3 }
    hsync_back_porch: 152
    hsync_front_porch: 48
    hsync_pulse_width: 162
    vsync_back_porch: 13
    vsync_front_porch: 3
    vsync_pulse_width: 45
    data_pins:
      red:   [1, 2, 42, 41, 40]
      blue:  [14, 38, 18, 17, 10]
      green: [39, 0, 45, 48, 47, 21]

touchscreen:
  platform: gt911
  id: my_touchscreen
  display: my_display
  i2c_id: bus_a
  # I2C scan confirms the chip sits at 0x5D (not 0x14). Pin it explicitly so
  # the driver does not fall back to the wrong secondary address.
  address: 0x5D
  interrupt_pin: GPIO4
  reset_pin:
    waveshare_io_ch32v003: waveshare_io_hub
    number: 1
    mode: OUTPUT
  # Provide calibration explicitly. Without it the driver must READ the max
  # resolution from the chip at boot; a single I2C read failure marks the
  # touchscreen FAILED ("Calibration error") and it never recovers.
  calibration:
    x_min: 0
    x_max: 1024
    y_min: 0
    y_max: 600
  on_touch:
    then:
      - lambda: |-
          if (id(idle_counter) == 0) {
            // The touch that wakes the screen must not also press a card.
            panel_cards::suppress_clicks(700);
            auto call = id(display_backlight).make_call();
            call.set_brightness(id(current_brightness));
            call.perform();
          }
          id(idle_counter) = id(idle_timeout_s);
  on_release:
      then:
        - if:
            condition: lvgl.is_paused
            then:
              - lvgl.resume:
              - lvgl.widget.redraw:
              - switch.turn_off: switch_antiburn

output:
  - platform: waveshare_io_ch32v003
    id: pwm_backlight_output
    inverted: true

light:
  - platform: monochromatic
    output: pwm_backlight_output
    name: Display Backlight
    entity_category: "config"
    id: display_backlight
    restore_mode: RESTORE_DEFAULT_ON

# --- LVGL MODULAR INTERFACE ---
packages:
  logic: !include base_logic.yaml
  gui: !include gui.yaml
  system: !include config/panel/system.yaml
  runtime_cards: !include config/panel/runtime_cards.yaml
  screenshot: !include config/panel/screenshot.yaml

lvgl:
  displays: [my_display]
  touchscreens: [my_touchscreen]

button:
  - platform: restart
    id: reboot_btn
    name: "Restart"
    entity_category: config
