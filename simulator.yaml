# simulator.yaml — runs the UI on a PC via SDL (esphome run simulator.yaml).
# ESPHome has no web_server on the host platform, so the web editor is not
# available here; set the "Panel Pages" / "Panel Card N" text entities through
# Home Assistant (add the simulator as an ESPHome device) or use initial values.
esphome:
  name: panel-simulator
  on_boot:
    - globals.set:
        id: boot_completed
        value: 'true'
    - delay: 5s
    - lvgl.widget.hide: boot_screen

host:

api:

logger:
  level: DEBUG

# Fonts first, then the interface
packages:
  logic: !include base_logic.yaml
  gui: !include gui.yaml
  system: !include config/panel/system.yaml
  runtime_cards: !include config/panel/runtime_cards.yaml

display:
  - platform: sdl
    id: my_display
    dimensions: { width: 1024, height: 600 }

touchscreen:
  - platform: sdl
    id: my_touchscreen
    display: my_display
    on_touch:
      then:
        - lambda: |-
            if (id(idle_counter) == 0) {
              panel_cards::suppress_clicks(700);
              id(display_backlight).make_call().set_brightness(id(current_brightness)).perform();
            }
            id(idle_counter) = id(idle_timeout_s);

lvgl:
  displays: [my_display]
  touchscreens: [my_touchscreen]

# Hardware stubs
sensor:
  - platform: template
    id: wifi_rssi
    lambda: "return -60.0;"
  - platform: template
    id: internal_bat_pct
    lambda: "return 85.0;"

output:
  - platform: template
    id: pwm_backlight_output
    type: float
    write_action: [lambda: "(void)0;"]

light:
  - platform: monochromatic
    output: pwm_backlight_output
    id: display_backlight

time:
  - platform: host
    id: sntp_time
