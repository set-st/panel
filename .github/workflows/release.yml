# Push a tag like v1.2.0 to publish a release. The panel checks the manifest of
# the latest release every 6 hours and offers the update in Home Assistant
# ("Firmware" update entity). Tags with a dash (v1.3.0-rc1) become pre-releases,
# which the panel does not see.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ESPHOME_VERSION: "2026.9.1"   # keep in sync with ci.yml
  BUILD_DIR: .esphome/build/esp32-s3-touch-lcd-7b/build

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO / ESP-IDF toolchain
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ env.ESPHOME_VERSION }}-${{ runner.os }}

      - name: Install ESPHome
        run: pip install "esphome==${ESPHOME_VERSION}"

      - name: Build firmware ${{ github.ref_name }}
        run: esphome -s firmware_version "${GITHUB_REF_NAME}" compile panel-s3.yaml

      - name: Collect binaries and write the update manifest
        env:
          REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          cp "${BUILD_DIR}/firmware.ota.bin" dist/panel-s3.ota.bin
          cp "${BUILD_DIR}/firmware.factory.bin" dist/panel-s3.factory.bin
          python3 - <<'PY'
          import hashlib, json, os
          tag = os.environ["GITHUB_REF_NAME"]
          base = f"https://github.com/{os.environ['REPO']}/releases/download/{tag}"
          md5 = hashlib.md5(open("dist/panel-s3.ota.bin", "rb").read()).hexdigest()
          manifest = {
              "name": "Smart Home Control Panel",
              "version": tag,
              "builds": [{
                  "chipFamily": "ESP32-S3",
                  "parts": [{"path": f"{base}/panel-s3.factory.bin", "offset": 0}],
                  "ota": {
                      "path": f"{base}/panel-s3.ota.bin",
                      "md5": md5,
                      "summary": f"Smart Home Control Panel {tag}",
                      "release_url": f"https://github.com/{os.environ['REPO']}/releases/tag/{tag}",
                  },
              }],
          }
          json.dump(manifest, open("dist/panel-s3.manifest.json", "w"), indent=2)
          PY
          cat dist/panel-s3.manifest.json
          ls -la dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --title "${GITHUB_REF_NAME}")
          [[ "${GITHUB_REF_NAME}" == *-* ]] && flags+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" dist/* "${flags[@]}"
